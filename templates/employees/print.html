<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ employee.employee_id }} - {{ employee.profile.full_name }}</title>
<style>
*{box-sizing:border-box}body{font:13px/1.5 Arial,sans-serif;color:#17253e;background:#eef2f7;margin:0}.toolbar{max-width:850px;margin:20px auto;display:flex;gap:12px}.toolbar button,.toolbar a{font:inherit;padding:8px 14px;border:1px solid #cbd5e1;border-radius:6px;background:white;color:#17253e;text-decoration:none}.sheet{max-width:850px;margin:20px auto;padding:36px;background:white;border:1px solid #dce2ee;border-radius:12px}header{border-bottom:2px solid #4338ca;padding-bottom:18px;margin-bottom:22px}h1{font-size:27px;margin:0 0 6px}header p{margin:4px 0;color:#64748b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.field{padding:10px 0;border-bottom:1px solid #e2e8f0;break-inside:avoid;overflow-wrap:anywhere}.field.long{grid-column:1/-1;break-inside:auto}.field dt{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.06em}.field dd{margin:3px 0 0;white-space:pre-wrap}.foot{font-size:10px;color:#64748b;margin-top:24px}
@page{size:A4;margin:14mm}@media print{body{background:white;margin:0}.toolbar{display:none}.sheet{max-width:none;border:0;border-radius:0;margin:0;padding:0}h1{font-size:23px}.fields{gap:0 18px}.field{padding:7px 0}}@media screen and (max-width:600px){.sheet{padding:18px;margin:10px}.fields{grid-template-columns:1fr}.toolbar{margin:10px}}
</style></head><body>
<div class="toolbar"><button type="button" onclick="window.print()">Print / Save as PDF</button><a href="{% url 'employees:pdf' employee.pk %}">Download PDF</a></div>
<article class="sheet"><header><h1>{{ employee.profile.full_name }}</h1><p>{{ employee.employee_id }} · {{ home_organization }}</p><p>{{ employee.display_status }}</p></header>
<dl class="fields">{% for key,label,value in employee_record %}<div class="field{% if value|length > 350 %} long{% endif %}"><dt>{{ label }}</dt><dd>{{ value|default:'—' }}</dd></div>{% endfor %}</dl><p class="foot">Confidential employee record</p></article>
<script>window.addEventListener('load',function(){window.print();});</script>
</body></html>
