{% comment %}Leave section tab strip — single source of truth, active tab by url_name.{% endcomment %}
  <!-- Tab Navigation -->
  {% if request.user.profile.role != 'user' %}
  <div class="border-b border-slate-200 dark:border-slate-800 overflow-x-auto no-scrollbar -mx-4 sm:mx-0 px-4 sm:px-0">
    <nav class="-mb-px flex gap-6 min-w-max" aria-label="Tabs">
      <a href="{% url 'leave:team' %}" class="whitespace-nowrap border-b-2 py-3 px-1 text-sm font-medium {% if request.resolver_match.url_name == 'team' %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 dark:text-slate-400 dark:hover:text-slate-300 dark:hover:border-slate-600 transition-colors{% endif %} flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 14 11 16 15 12"/></svg>
        Requests
      </a>
      <a href="{% url 'leave:balances' %}" class="whitespace-nowrap border-b-2 py-3 px-1 text-sm font-medium {% if request.resolver_match.url_name == 'balances' %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 dark:text-slate-400 dark:hover:text-slate-300 dark:hover:border-slate-600 transition-colors{% endif %} flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        Balances
      </a>
      <a href="{% url 'leave:usage' %}" class="whitespace-nowrap border-b-2 py-3 px-1 text-sm font-medium {% if request.resolver_match.url_name == 'usage' %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 dark:text-slate-400 dark:hover:text-slate-300 dark:hover:border-slate-600 transition-colors{% endif %} flex items-center gap-2">

        Usage Report
      </a>
      <a href="{% url 'leave:holidays' %}" class="whitespace-nowrap border-b-2 py-3 px-1 text-sm font-medium {% if request.resolver_match.url_name == 'holidays' %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 dark:text-slate-400 dark:hover:text-slate-300 dark:hover:border-slate-600 transition-colors{% endif %} flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Holidays
      </a>
      <a href="{% url 'leave:log' %}" class="whitespace-nowrap border-b-2 py-3 px-1 text-sm font-medium {% if request.resolver_match.url_name == 'log' %}border-primary-500 text-primary-600 dark:text-primary-400{% else %}border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 dark:text-slate-400 dark:hover:text-slate-300 dark:hover:border-slate-600 transition-colors{% endif %} flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
