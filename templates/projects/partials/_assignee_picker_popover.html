<div class="assignee-picker fixed z-50 w-80 bg-white rounded-xl shadow-2xl border border-gray-200/80 overflow-hidden backdrop-blur-sm transition-opacity duration-150 ease-out dark:border-gray-700 dark:bg-gray-900" 
     id="assignee-picker" 
     hidden 
     role="dialog" 
     aria-label="Edit assignees">
     
  <div class="p-3.5 border-b border-gray-100 bg-white dark:border-gray-800 dark:bg-gray-900">
    <div class="relative flex items-center">
      <svg class="absolute left-3 w-4 h-4 text-gray-400 pointer-events-none dark:text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.603 10.601z" />
      </svg>
      <input type="text" 
             id="assignee-picker-search-input" 
             placeholder="Search team members…" 
             autocomplete="off"
             class="w-full pl-9 pr-3 py-2 text-sm text-gray-800 bg-gray-50/50 border border-gray-200 rounded-lg focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all placeholder:text-gray-400 dark:border-gray-700 dark:bg-gray-800/50 dark:text-white dark:placeholder:text-gray-500 dark:focus:border-indigo-500 dark:focus:bg-gray-800 dark:focus:ring-indigo-500/20">
    </div>
  </div>

  <div class="assignee-picker-list max-h-64 overflow-y-auto p-1.5 space-y-0.5 scrollbar-thin scrollbar-thumb-gray-200 dark:scrollbar-thumb-gray-700" 
       id="assignee-picker-list">
    </div>

  <div class="px-4 py-2.5 bg-gray-50 border-t border-gray-200 flex justify-between items-center text-xs font-medium text-gray-500 select-none dark:border-gray-800 dark:bg-gray-800/80 dark:text-gray-400">
    <span id="assignee-picker-count" class="bg-gray-200/60 px-2 py-0.5 rounded-full text-gray-600 dark:bg-gray-700 dark:text-gray-300">0 selected</span>
    <span id="assignee-picker-status" class="italic text-gray-400 dark:text-gray-500"></span>
  </div>
</div>
