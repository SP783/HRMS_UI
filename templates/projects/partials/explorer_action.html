<form hx-post="{{ action_url }}" hx-target="#px-editor-body" hx-swap="innerHTML" hx-disabled-elt="find button[type='submit']">
  {% csrf_token %}<input type="hidden" name="version" value="{{ version }}">
  <h3>{{ heading }}</h3>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  {% if confirmation %}<p>Confirm {{ heading|lower }}: <strong>{{ target }}</strong>?</p>{% endif %}
  {{ form.as_p }}{% if project_form %}{{ project_form.as_p }}{% endif %}
  <button type="submit" class="px-button px-primary">{% if confirmation %}Confirm{% else %}Save{% endif %}</button>
</form>
