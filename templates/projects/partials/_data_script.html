<div class="hidden" id="data-bridge-container">
  <div class="mb-4 rounded-lg border border-indigo-200 bg-indigo-50 p-4 dark:border-indigo-900/30 dark:bg-indigo-900/10">
    <h3 class="mb-2 text-sm font-bold tracking-wider text-indigo-800 uppercase dark:text-indigo-400">
      Data Bridge Configuration
    </h3>
    
    {{ team_members_json|json_script:"projects-team-members-data" }}
    {{ pipelines_json|json_script:"projects-pipelines-data" }}

    <script>
      (function() {
        const getData = (id) => JSON.parse(document.getElementById(id).textContent);

        window.PROJECTS_DATA = {
          csrf: "{{ csrf_token }}",
          urls: {
            create: "{% url 'projects:create' %}",
            client_create: "{% url 'projects:client_create_ajax' %}",
            department_create: "{% url 'projects:department_create_ajax' %}",
          },
          team_members: getData('projects-team-members-data'),
          // FIX: Updated the ID to strictly match the json_script tag above
          pipelines: getData('projects-pipelines-data'), 
        };
      })();
    </script>
  </div>
</div>
