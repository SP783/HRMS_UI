<button type="button"
        data-target-pk="{{ target_pk }}"
        data-kind="{{ kind }}"
        data-size="{{ size }}"
        data-assignees="{{ profile_ids_csv }}"
        {% if can_edit %}onclick="openAssigneePicker(this)"{% else %}disabled tabindex="-1"{% endif %}
        class="group flex items-center transition-opacity rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900 {% if can_edit %}cursor-pointer hover:opacity-80{% else %}cursor-default{% endif %}"
        aria-label="{% if can_edit %}Assignees — click to edit{% else %}Assignees (read-only){% endif %}">
  
  {% if visible %}
    <div class="flex -space-x-2 overflow-hidden">
      {% for u in visible %}
        <span class="inline-flex items-center justify-center rounded-full border-2 border-white bg-indigo-100 text-indigo-700 font-medium dark:border-gray-900 dark:bg-indigo-900/50 dark:text-indigo-300 
                     {% if size == 'sm' %}w-6 h-6 text-[10px]{% else %}w-8 h-8 text-xs{% endif %}"
              title="{{ u.full_name }}">
          {{ u.initials }}
        </span>
      {% endfor %}

      {% if overflow %}
        <span class="inline-flex items-center justify-center rounded-full border-2 border-white bg-gray-100 text-gray-600 font-medium dark:border-gray-900 dark:bg-gray-800 dark:text-gray-400 
                     {% if size == 'sm' %}w-6 h-6 text-[10px]{% else %}w-8 h-8 text-xs{% endif %}"
              title="{{ overflow }} more">
          +{{ overflow }}
        </span>
      {% endif %}
    </div>
  {% else %}
    <span class="inline-flex items-center justify-center rounded-full border-2 border-dashed border-gray-300 bg-gray-50 text-gray-400 transition-colors hover:border-gray-400 hover:text-gray-500 dark:border-gray-700 dark:bg-gray-800/50 dark:text-gray-500 dark:hover:border-gray-500 dark:hover:text-gray-400
                 {% if size == 'sm' %}w-6 h-6{% else %}w-8 h-8{% endif %}">
      <svg class="{% if size == 'sm' %}w-3 h-3{% else %}w-4 h-4{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    </span>
  {% endif %}
</button>
