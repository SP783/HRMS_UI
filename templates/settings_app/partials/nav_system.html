{% load static %}
{% comment %}System Settings horizontal tab navigation.{% endcomment %}

<div class="w-full border-b border-gray-200 overflow-x-auto hide-scrollbar">
  <nav class="-mb-px flex flex-nowrap gap-4 min-w-max" aria-label="System settings tabs">
    
    <a href="{% url 'settings_app:email' %}" 
       class="group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors
              {% if request.resolver_match.url_name == 'email' %}
                border-indigo-500 text-indigo-600
              {% else %}
                border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300
              {% endif %}">
      <svg class="flex-shrink-0 mr-2 h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      Email Config
    </a>

    <a href="{% url 'settings_app:telegram' %}" 
       class="group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors
              {% if request.resolver_match.url_name == 'telegram' %}
                border-indigo-500 text-indigo-600
              {% else %}
                border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300
              {% endif %}">
      <svg class="flex-shrink-0 mr-2 h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      Telegram Alerts
    </a>

    <a href="{% url 'settings_app:backup' %}" 
       class="group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors
              {% if request.resolver_match.url_name == 'backup' or request.resolver_match.url_name == 'backup_history' %}
                border-indigo-500 text-indigo-600
              {% else %}
                border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300
              {% endif %}">
      <svg class="flex-shrink-0 mr-2 h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Backup &amp; Restore
    </a>

    <a href="{% url 'settings_app:permissions' %}" 
       class="group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors
              {% if request.resolver_match.url_name == 'permissions' %}
                border-indigo-500 text-indigo-600
              {% else %}
                border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300
              {% endif %}">
      <svg class="flex-shrink-0 mr-2 h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Role Permissions
    </a>

    <a href="{% url 'settings_app:site_branding' %}" 
       class="group inline-flex items-center py-4 px-1 border-b-2 font-medium text-sm whitespace-nowrap transition-colors
              {% if request.resolver_match.url_name == 'site_branding' %}
                border-indigo-500 text-indigo-600
              {% else %}
                border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300
              {% endif %}">
      <svg class="flex-shrink-0 mr-2 h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="4"/>
        <line x1="21.17" y1="8" x2="12" y2="8"/>
        <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
        <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
      </svg>
      Site Branding
    </a>

  {% if user.profile.role == "super_admin" %}<a class="inline-flex items-center py-4 px-1 border-b-2 border-transparent font-medium text-sm whitespace-nowrap" href="{% url 'organizations:sharing' %}">Sharing Configuration</a>{% endif %}
    </nav>
</div>
