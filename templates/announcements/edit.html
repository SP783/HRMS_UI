{% extends "base.html" %}
{% block title %}Edit announcement — {{ site_name }}{% endblock %}
{% block page_title %}Edit announcement{% endblock %}

{% block content %}
{% include "settings_app/partials/nav_hr.html" %}

<div class="max-w-2xl mx-auto pb-12">
  
  <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
    
    <!-- Card Header -->
    <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-[#0f172a]/50 flex items-center gap-2 text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-primary-500">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Edit "{{ notice.title }}"
    </div>
    
    <!-- Card Body (Form) -->
    <div class="p-6 sm:p-8">
      <form method="post">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-5">
          
          <!-- Title -->
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Title <span class="text-rose-500">*</span></label>
            <input type="text" name="title" required maxlength="200" value="{{ notice.title }}"
                   class="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
          </div>
          
          <!-- Message Body -->
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Message <span class="text-rose-500">*</span></label>
            <textarea name="body" rows="4" required class="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all resize-y">{{ notice.body }}</textarea>
          </div>
          
          <!-- Priority -->
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Priority</label>
            <select name="priority" class="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
              {% for code, label in priority_choices %}
                <option value="{{ code }}" {% if code == notice.priority %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
          
          <!-- Expiration Date -->
          <div>
            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Expires on</label>
            <input type="date" name="expires_on" class="w-full px-4 py-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all color-scheme-dark"
                   value="{% if notice.expires_on %}{{ notice.expires_on|date:'Y-m-d' }}{% endif %}">
          </div>
          
          <!-- Pinned Checkbox -->
          <div class="sm:col-span-2 pt-2">
            <label class="inline-flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" name="is_pinned" {% if notice.is_pinned %}checked{% endif %}
                     class="w-4 h-4 text-primary-600 bg-white border-slate-300 rounded focus:ring-primary-500 dark:focus:ring-primary-600 dark:ring-offset-slate-900 focus:ring-2 dark:bg-slate-800 dark:border-slate-600 transition-colors">
              <span class="text-sm font-medium text-slate-700 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white transition-colors">Pin to top of dashboard</span>
            </label>
          </div>
          
        </div>
        
        <!-- Action Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800/60 flex items-center gap-3">
          <button type="submit" class="inline-flex items-center gap-2 px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition-colors shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 dark:focus:ring-offset-slate-900">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
            </svg>
            Save changes
          </button>
          <a href="{% url 'announcements:manage' %}" class="px-5 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm">
            Cancel
          </a>
        </div>

      </form>
    </div>
  </div>
</div>

<style>
  /* Fix date inputs icon color in dark mode */
  .dark .color-scheme-dark { color-scheme: dark; }
</style>
{% endblock %}
